<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CC0033">
<script>/* the scan link opens on black; set it before first paint */
if (/^#\/card\?d=/.test(location.hash)) document.documentElement.className = "boot-scan";</script>
<title>Multisys Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --red:#CC0033;        /* multisys red */
    --orange:#EB6004;     /* multisys orange */
    --bar-y:#FFCC33; --bar-o:#CC6600; --bar-r:#CC3333;
    --ink:var(--red);     /* primary actions */
    --paper:#FFFFFF;
    --bg:#F3F0EC;
    --text:#2A2A2A;
    --muted:#6E6E6E;
    --line:#DDD8D2;
    --cw:min(84vh, 620px);            /* card long edge */
    --ch:calc(var(--cw) * 4 / 7);     /* 3.5in × 2in ratio */
    --fs:calc(var(--cw) / 100);       /* card font unit */
  }
  *{box-sizing:border-box}
  html.boot-scan,html.boot-scan body{background:#0a0a0c}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
  a{color:inherit}
  button{font:inherit}

  /* app chrome */
  header{position:sticky;top:0;z-index:5;background:var(--bg);display:none;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  body.chrome header{display:flex}
  header h1{font-size:17px;font-weight:800;margin:0;flex:1;letter-spacing:-.01em}
  .btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--ink);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn.danger{background:transparent;color:#A32D2D;border:1.5px solid #A32D2D}
  .btn.icon{padding:8px 10px}
  main{padding:16px;max-width:720px;margin:0 auto}

  /* list */
  .item{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;text-decoration:none}
  .item .mono{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
  .item b{display:block;font-size:16px}
  .item span{color:var(--muted);font-size:13px}
  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}

  /* form */
  form{display:grid;gap:14px}
  label{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
  input{font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--text)}
  input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(204,0,51,.15)}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row .btn{flex:1}

  /* rotated card stage */
  .stage{display:grid;place-items:center;min-height:calc(100dvh - 60px);padding:16px 0 90px}
  .rotor{position:relative;width:var(--ch);height:var(--cw)}
  .card{
    position:absolute;top:0;left:0;width:var(--cw);height:var(--ch);
    transform:translateX(var(--ch)) rotate(90deg);transform-origin:0 0;
    background:var(--paper);color:var(--text);border-radius:calc(var(--fs) * 3);
    box-shadow:0 30px 60px -20px rgba(42,42,42,.45), 0 0 0 1px var(--line);
    padding:calc(var(--fs) * 6);display:grid;grid-template-columns:1fr auto;gap:calc(var(--fs) * 5);
    overflow:hidden;
  }
  .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--fs) * 1.6);
    background:linear-gradient(90deg,var(--bar-y) 0 34%,var(--bar-o) 34% 67%,var(--bar-r) 67%)}
  .card .left{display:flex;flex-direction:column;min-width:0}
  .card .logo{height:calc(var(--fs) * 8);width:auto;align-self:flex-start;margin-bottom:auto}
  .card .name{font-size:calc(var(--fs) * 7.2);font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .title{font-size:calc(var(--fs) * 3.4);color:var(--red);font-weight:600;margin:calc(var(--fs) * 1) 0 calc(var(--fs) * 3)}
  .card .contact{font-size:calc(var(--fs) * 2.9);line-height:1.5;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .contact div{overflow:hidden;text-overflow:ellipsis}
  .card .qr{align-self:end;background:#fff;padding:0;border-radius:0;width:calc(var(--fs) * 26);height:calc(var(--fs) * 26)}
  .card .qr svg{width:100%;height:100%;display:block}

  .dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;max-width:720px;margin:0 auto}
  .dock .btn{flex:1}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin:0 0 6px}

  /* wide screens: card lies flat, no rotation */
  @media (min-width:720px), (orientation:landscape){
    :root{--cw:min(84vw, 620px)}
    .rotor{width:var(--cw);height:var(--ch)}
    .card{transform:none}
    .stage{min-height:auto;padding-top:40px}
  }
  @media (prefers-reduced-motion:no-preference){
    .card{transition:transform .35s ease}
  }
  /* ---- scan view: the page a QR lands on ----
     Phases are classes on <body>: scan -> s-scan -> s-lock -> s-reveal -> ready, plus
     `rotated` once the reader taps the card and `fast` when a tap skips the intro.
     The card is fixed at 620px and sized purely by transform, so --kUp/--kRot (set in JS,
     because CSS calc cannot divide a length by a length) can animate between the two
     orientations without touching layout. */
  body.scan{--cw:620px;--ch:calc(620px * 4 / 7);--fs:6.2px}
  body.scan #hdr{display:none}
  body.scan{overflow:hidden}
  body.scan main{padding:0}

  /* backdrop: black while scanning, then paper with slow brand-coloured drift */
  .fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:#0a0a0c;transition:background-color 1.1s ease}
  body.scan.s-reveal .fx{background-color:var(--bg)}
  .sh{position:absolute;will-change:transform}
  .sh i{display:block;width:100%;height:100%;border-radius:50%;filter:blur(46px);
    opacity:0;transition:opacity 1.4s ease}
  body.scan.s-reveal .sh i{opacity:.34}
  .s1{width:58vw;height:58vw;left:-18vw;top:5vh}   .s1 i{background:var(--red);animation:drift 31s ease-in-out infinite alternate}
  .s2{width:46vw;height:46vw;right:-14vw;top:24vh} .s2 i{background:var(--orange);animation:drift 38s ease-in-out infinite alternate-reverse}
  .s3{width:38vw;height:38vw;left:10vw;bottom:6vh} .s3 i{background:var(--bar-y);animation:drift 26s ease-in-out infinite alternate-reverse}
  .s4{width:30vw;height:30vw;right:2vw;bottom:20vh}.s4 i{background:var(--bar-r);animation:drift 35s ease-in-out infinite alternate}
  .s5{width:24vw;height:24vw;left:36vw;top:-5vh}   .s5 i{background:var(--bar-o);animation:drift 22s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(5%,4%,0) scale(1.1)}}

  /* viewfinder: quiet. Hairline brackets, one pale sweep, no glow. */
  .vf{position:fixed;inset:0;z-index:3;display:grid;place-items:center;
    opacity:0;transition:opacity .5s ease;pointer-events:none}
  body.scan.s-scan .vf{opacity:1}
  body.scan.s-reveal .vfbox .c,body.scan.s-reveal .laser,body.scan.s-reveal .vftext{
    opacity:0;transition:opacity .3s ease}
  body.scan.qr-landed .vf{opacity:0;transition:opacity .2s ease}
  /* the card's own code only appears once the flying one has arrived on top of it */
  body.scan .card .qr{opacity:0}
  body.scan.qr-landed .card .qr{opacity:1;transition:opacity .2s ease}
  .vfbox{position:relative;width:min(44vw,176px);aspect-ratio:1;display:grid;place-items:center}
  .vfqr{width:72%;background:#fff;padding:7px;border-radius:8px;opacity:.82;
    transition:opacity .4s ease}
  body.scan.s-lock .vfqr{opacity:1}
  .vfqr svg{width:100%;height:100%;display:block}
  .vfbox .c{position:absolute;width:19px;height:19px;border:1.5px solid rgba(255,255,255,.34);
    transition:transform .5s cubic-bezier(.22,1.08,.36,1),border-color .4s ease}
  .c.tl{top:0;left:0;border-right:0;border-bottom:0;transform:translate(-7px,-7px)}
  .c.tr{top:0;right:0;border-left:0;border-bottom:0;transform:translate(7px,-7px)}
  .c.bl{bottom:0;left:0;border-right:0;border-top:0;transform:translate(-7px,7px)}
  .c.br{bottom:0;right:0;border-left:0;border-top:0;transform:translate(7px,7px)}
  body.scan.s-lock .vfbox .c{transform:none;border-color:rgba(255,255,255,.72)}
  .laser{position:absolute;left:2%;right:2%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:sweep 1.9s cubic-bezier(.45,0,.55,1) infinite}
  body.scan.s-lock .laser{animation:none;opacity:0;transition:opacity .3s ease}
  @keyframes sweep{0%,100%{top:6%}50%{top:90%}}
  .vftext{position:absolute;left:0;right:0;top:calc(50% + min(22vw,88px) + 30px);
    margin:0;display:grid;place-items:center;font-size:10px;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.34)}
  .vftext span{grid-area:1/1;white-space:nowrap;transition:opacity .35s ease}
  .vftext .t2{opacity:0;color:rgba(255,255,255,.6)}
  body.scan.s-lock .vftext .t1{opacity:0}
  body.scan.s-lock .vftext .t2{opacity:1}

  /* the card: upright by default, tap rotates it to full size */
  body.scan .stage{position:fixed;inset:0;z-index:1;min-height:0;padding:0;
    display:block;overflow:hidden}
  body.scan .rotor{position:absolute;inset:0;width:auto;height:auto;
    opacity:0;transform-origin:50% 50%}
  body.scan .card{position:absolute;left:50%;top:50%;transform-origin:50% 50%;
    transform:translate(-50%,-50%) scale(var(--kUp,.56));
    transition:transform .62s cubic-bezier(.3,1.05,.4,1)}
  body.scan.rotated .card{transform:translate(-50%,-50%) rotate(90deg) scale(var(--kRot,.95))}
  body.scan.s-reveal .rotor{animation:cardTurn .72s cubic-bezier(.2,.88,.3,1) .18s both}
  body.scan.s-reveal .card .logo,body.scan.s-reveal .card .name,body.scan.s-reveal .card .title,
  body.scan.s-reveal .card .contact div{animation:riseIn .5s ease-out both}
  body.scan.s-reveal .card .logo{animation-delay:.62s}
  body.scan.s-reveal .card .name{animation-delay:.70s}
  body.scan.s-reveal .card .title{animation-delay:.77s}
  body.scan.s-reveal .card .contact div:nth-child(1){animation-delay:.83s}
  body.scan.s-reveal .card .contact div:nth-child(2){animation-delay:.88s}
  body.scan.s-reveal .card .contact div:nth-child(3){animation-delay:.93s}
  @keyframes cardTurn{
    from{opacity:0;transform:perspective(1200px) rotateY(-82deg) rotateX(6deg) scale(.46)}
    45%{opacity:1}
    to{opacity:1;transform:perspective(1200px) rotateY(0) rotateX(0) scale(1)}
  }
  @keyframes riseIn{from{opacity:0;transform:translateY(calc(var(--fs) * 2.2))}to{opacity:1;transform:none}}

  /* tap affordance, shown once the card has landed and retired after the first rotate */
  .turn{margin:0 0 10px;text-align:center;font-size:10px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    opacity:0;transition:opacity .5s ease}
  body.scan.ready .turn{opacity:.5}
  body.scan.rotated .turn{opacity:0}

  body.scan .dock{z-index:4;flex-direction:column;align-items:center;gap:0;
    background:linear-gradient(to top,var(--bg) 58%,transparent);
    transform:translateY(130%);opacity:0;pointer-events:none;
    transition:transform .5s cubic-bezier(.22,1.08,.36,1),opacity .35s ease}
  body.scan.ready .dock{transform:none;opacity:1;pointer-events:auto}
  body.scan .dock .hint{margin:0 0 10px;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  body.scan .dock .row{display:flex;width:auto;gap:0;padding:4px;border-radius:999px;
    background:rgba(255,255,255,.74);border:1px solid var(--line);
    box-shadow:0 12px 34px -16px rgba(42,42,42,.5);backdrop-filter:blur(14px)}
  .act{border:0;background:none;cursor:pointer;padding:12px 30px;border-radius:999px;
    font:inherit;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--red);
    transition:background-color .2s ease}
  .act:active{background:rgba(42,42,42,.06)}

  /* save sheet */
  .sheet[hidden]{display:none!important}
  .sheet{position:fixed;inset:0;z-index:6;display:grid;align-items:end}
  .sheetbg{position:absolute;inset:0;background:rgba(20,18,16,.38);
    backdrop-filter:blur(3px);opacity:0;transition:opacity .28s ease}
  .sheetcard{position:relative;margin:0 auto;width:min(100%,420px);
    background:rgba(255,255,255,.92);backdrop-filter:blur(18px);
    border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
    padding:18px 16px calc(14px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .38s cubic-bezier(.22,1.08,.36,1)}
  .sheet.open .sheetbg{opacity:1}
  .sheet.open .sheetcard{transform:none}
  .sheettitle{margin:0 0 14px;text-align:center;font-size:11px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .sheetopt{display:block;width:100%;border:0;background:none;font:inherit;font-size:16px;
    font-weight:700;color:var(--text);padding:15px 8px;cursor:pointer;border-radius:12px;
    transition:background-color .2s ease}
  .sheetopt + .sheetopt{box-shadow:inset 0 1px 0 var(--line)}
  .sheetopt.primary{color:var(--red)}
  .sheetopt.cancel{color:var(--muted);font-weight:600;margin-top:6px;box-shadow:none}
  .sheetopt:active{background:rgba(42,42,42,.06)}
  @media (prefers-reduced-motion:reduce){
    .sheetbg,.sheetcard{transition:none}
  }

  /* a tap collapses the delays rather than cutting the motion dead */
  body.scan.fast .rotor{animation-duration:.32s;animation-delay:0s}
  body.scan.fast .vfbox{animation-duration:.2s}
  body.scan.fast .card .logo,body.scan.fast .card .name,body.scan.fast .card .title,
  body.scan.fast .card .contact div{animation-delay:0s;animation-duration:.24s}

  @media (prefers-reduced-motion:reduce){
    body.scan .fx{background-color:var(--bg)}
    body.scan .vf{display:none}
    body.scan .rotor,body.scan.s-reveal .rotor,body.scan.s-reveal .card .logo,
    body.scan.s-reveal .card .name,body.scan.s-reveal .card .title,
    body.scan.s-reveal .card .contact div{animation:none;opacity:1}
    body.scan .card{transition:none}
    .sh i{animation:none}
    body.scan .dock,.turn{transition:none}
  }
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header id="hdr"><h1 id="hdrTitle">Multisys cards</h1></header>
<main id="app"></main>
<div class="toast" id="toast"></div>

/* ---------- storage ---------- */
const KEY = "cards.v1";
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = (cards) => localStorage.setItem(KEY, JSON.stringify(cards));
const uid = () => Math.random().toString(36).slice(2, 9);

if (load().length === 0) {
  save([{ id: uid(), name: "Maya Santos", title: "Product Manager",
          phone: "+63 917 555 0142", email: "maya@multisys.com",
          website: "multisys.com", createdAt: Date.now() }]);
}

/* ---------- url encoding for QR ---------- */
const enc = (obj) => btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const dec = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
const publicUrl = (c) => {
  const { id, createdAt, ...pub } = c;
  return location.origin + location.pathname + "#/card?d=" + enc(pub);
};
const vcard = (c) => [
  "BEGIN:VCARD","VERSION:3.0",`FN:${c.name}`,`TITLE:${c.title||""}`,`ORG:${COMPANY.name}`,
  `TEL;TYPE=CELL:${c.phone||""}`,`EMAIL:${c.email||""}`,`URL:${c.website||""}`,"END:VCARD"].join("\n");

const esc = (s="") => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const initials = (n="") => n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();

/* ---------- views ---------- */
const app = document.getElementById("app");
const hdr = document.getElementById("hdr");
function setHeader(title, actions="") {
  hdr.innerHTML = `<h1>${esc(title)}</h1>${actions}`;
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }

function viewList() {
  const cards = load();
  setHeader("Multisys cards", `<button class="btn" onclick="location.hash='#/new'">New card</button>`);
  app.innerHTML = cards.length ? cards.map(c => `
    <a class="item" href="#/view/${c.id}">
      <div class="mono">${initials(c.name)}</div>
      <div><b>${esc(c.name)}</b><span>${esc(c.title||"")}</span></div>
    </a>`).join("")
  : `<div class="empty"><b>No cards yet</b>Create your first card to get a QR code.</div>`;
}

function viewEdit(id) {
  const c = id ? load().find(x=>x.id===id) : {};
  if (id && !c) return (location.hash = "#/");
  setHeader(id ? "Edit card" : "New card", `<button class="btn ghost" onclick="history.back()">Cancel</button>`);
  const f = (k,label,type="text") => `<label>${label}<input name="${k}" type="${type}" value="${esc(c[k]||"")}" ${k==="name"?"required":""}></label>`;
  app.innerHTML = `<form id="f">
    ${f("name","Full name")}${f("title","Job title")}${f("phone","Phone","tel")}${f("email","Email","email")}${f("website","Website","url")}
    <div class="row"><button class="btn" type="submit">${id?"Save changes":"Create card"}</button>
    ${id?`<button class="btn danger" type="button" id="del">Delete</button>`:""}</div>
  </form>`;
  document.getElementById("f").onsubmit = (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    let cards = load();
    if (id) cards = cards.map(x => x.id===id ? {...x, ...data} : x);
    else { data.id = uid(); data.createdAt = Date.now(); cards.push(data); id = data.id; }
    save(cards); toast(id ? "Saved" : "Created"); location.hash = "#/view/" + id;
  };
  const del = document.getElementById("del");
  if (del) del.onclick = () => { if (confirm("Delete this card?")) { save(load().filter(x=>x.id!==id)); location.hash="#/"; } };
}

function renderCard(c, qrText) {
  const qr = qrcode(0, "M"); qr.addData(qrText); qr.make();
  return `<div class="stage"><div class="rotor"><div class="card">
    <div class="left">
      ${COMPANY.logo}
      <h2 class="name">${esc(c.name)}</h2>
      <div class="title">${esc(c.title||"")}</div>
      <div class="contact">
        ${c.phone?`<div>${esc(c.phone)}</div>`:""}
        ${c.email?`<div>${esc(c.email)}</div>`:""}
        ${c.website?`<div>${esc(c.website)}</div>`:""}
      </div>
    </div>
    <div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
  </div></div></div>`;
}

function viewCard(id) {
  const c = load().find(x=>x.id===id);
  if (!c) return (location.hash = "#/");
  const url = publicUrl(c);
  setHeader(c.name, `<button class="btn ghost" onclick="location.hash='#/'">All cards</button>`);
  app.innerHTML = renderCard(c, url) + `
    <div class="dock">
      <button class="btn ghost" onclick="location.hash='#/edit/${c.id}'">Edit</button>
      <button class="btn" id="share">Share link</button>
    </div>`;
  document.getElementById("share").onclick = async () => {
    if (navigator.share) { try { await navigator.share({ title: c.name, url }); } catch {} }
    else { await navigator.clipboard.writeText(url); toast("Link copied"); }
  };
}

function viewPublic(param) {
  let c; try { c = dec(param); } catch { app.innerHTML = `<div class="empty"><b>This link is broken</b>Ask the card owner to share it again.</div>`; return; }
  setHeader(COMPANY.name);
  const first = (c.name || "").trim().split(/\s+/)[0] || "this";
  const vfq = qrcode(0, "M"); vfq.addData(location.href); vfq.make();
  const B = document.body;
  B.className = "scan";
  app.innerHTML = `
    <div class="fx" aria-hidden="true">
      <span class="sh s1" data-p=".06"><i></i></span><span class="sh s2" data-p=".13"><i></i></span>
      <span class="sh s3" data-p=".09"><i></i></span><span class="sh s4" data-p=".17"><i></i></span>
      <span class="sh s5" data-p=".21"><i></i></span>
    </div>
    <div class="vf" aria-hidden="true">
      <div class="vfbox">
        <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
        <div class="vfqr">${vfq.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</div>
        <div class="laser"></div>
      </div>
      <p class="vftext"><span class="t1">Scanning</span><span class="t2">Card received</span></p>
    </div>` + renderCard(c, location.href) + `
    <div class="dock">
      <p class="turn">Tap card to rotate</p>
      <div class="row"><button class="act" id="save">Save card</button></div>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="sheetbg"></div>
      <div class="sheetcard" role="dialog" aria-modal="true" aria-label="Save this card">
        <p class="sheettitle">Save ${esc(first)}&rsquo;s card</p>
        <button class="sheetopt primary" id="vcf">Add to contacts</button>
        <button class="sheetopt" id="img">Save as image</button>
        <button class="sheetopt cancel" id="cancel">Cancel</button>
      </div>
    </div>`;

  /* the card is laid out at a fixed 620px and fitted by transform; calc() cannot divide a
     length by a length, so the two scales are measured here and re-measured on resize. */
  const CW = 620, CH = CW * 4 / 7;
  const dockEl = app.querySelector(".dock");
  let qrFlight = null;
  const fit = () => {
    const vv = window.visualViewport;
    const w = Math.round(vv ? vv.width : innerWidth);
    const h = Math.round(vv ? vv.height : innerHeight);
    // clear the dock on both sides so the card reads as centred, not merely fitted
    const gap = Math.max(dockEl.offsetHeight, 88) * 2 + 28;
    B.style.setProperty("--kUp", Math.min((w - 44) / CW, (h - gap) / CH, 1));
    B.style.setProperty("--kRot", Math.min((h - gap) / CW, (w - 36) / CH, 1.3));
    if (qrFlight && qrFlight.playState === "running") { qrFlight.finish(); }
  };
  fit();
  addEventListener("resize", fit);
  addEventListener("orientationchange", fit);
  if (window.visualViewport) visualViewport.addEventListener("resize", fit);

  const sheet = document.getElementById("sheet");
  const closeSheet = () => { sheet.classList.remove("open"); setTimeout(() => { sheet.hidden = true; }, 300); };
  const openSheet = () => { sheet.hidden = false; requestAnimationFrame(() => sheet.classList.add("open")); };
  document.getElementById("save").onclick = openSheet;
  document.getElementById("cancel").onclick = closeSheet;
  sheet.querySelector(".sheetbg").onclick = closeSheet;
  document.getElementById("img").onclick = () => { closeSheet(); saveImage(c, location.href); };
  document.getElementById("vcf").onclick = () => {
    closeSheet();
    const blob = new Blob([vcard(c)], { type: "text/vcard" });
    const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: c.name.replace(/\s+/g,"_") + ".vcf" });
    a.click();
    toast("Contact saved");
  };
  const onKey = (e) => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); };
  addEventListener("keydown", onKey);

  /* Hand the scanned code over to the card: measure where the card's QR actually sits
     (it is scaled by --kUp, so only a live rect is trustworthy) and fly the viewfinder
     tile onto it. Scaling is about the tile's centre, and its padding is symmetric, so the
     inner svg's centre is the tile's centre and one translate+scale lines both up. */
  const landQr = () => { B.classList.add("qr-landed"); };
  const flyQr = () => {
    const tile = app.querySelector(".vfqr");
    const cardEl = app.querySelector(".card");
    const qrEl = app.querySelector(".card .qr");
    const stage = app.querySelector(".stage");
    if (!tile || !qrEl || !stage) return landQr();
    const from = tile.getBoundingClientRect();
    const fromSvg = tile.querySelector("svg").getBoundingClientRect();
    // Work out where the card's QR will END UP rather than reading a live rect: the card is
    // still turning in, so its rect is foreshortened. .stage is fixed to the viewport and the
    // card is centred in it at scale(--kUp), so the resting slot follows from layout offsets.
    const k0 = parseFloat(getComputedStyle(B).getPropertyValue("--kUp"));
    const sr = stage.getBoundingClientRect();
    const qw = parseFloat(getComputedStyle(qrEl).width), qh = parseFloat(getComputedStyle(qrEl).height);
    const cw = parseFloat(getComputedStyle(cardEl).width), chh = parseFloat(getComputedStyle(cardEl).height);
    if (!fromSvg.width || !qw || !k0) return landQr();
    const toW = qw * k0;
    const toCx = sr.left + sr.width / 2 + (qrEl.offsetLeft + qw / 2 - cw / 2) * k0;
    const toCy = sr.top + sr.height / 2 + (qrEl.offsetTop + qh / 2 - chh / 2) * k0;
    // The tile sits inside .vfbox, which is scaled on lock, and a child's translate and
    // transform-origin are in that scaled space -- so convert screen px to local px.
    // Scale is exempt: it multiplies the already-scaled on-screen width.
    const ps = (from.width / tile.offsetWidth) || 1;
    tile.style.transformOrigin =
      `${(fromSvg.left + fromSvg.width / 2 - from.left) / ps}px ${(fromSvg.top + fromSvg.height / 2 - from.top) / ps}px`;
    const k = toW / fromSvg.width;
    const dx = (toCx - (fromSvg.left + fromSvg.width / 2)) / ps;
    const dy = (toCy - (fromSvg.top + fromSvg.height / 2)) / ps;
    qrFlight = tile.animate([
      { transform: "translate(0px,0px) scale(1)", backgroundColor: "rgba(255,255,255,1)", borderRadius: "8px" },
      { transform: `translate(${dx}px,${dy}px) scale(${k})`, backgroundColor: "rgba(255,255,255,0)", borderRadius: "2px" },
    ], { duration: 700, easing: "cubic-bezier(.5,.02,.25,1)", fill: "forwards" });
    qrFlight.finished.then(landQr, () => {});
  };

  /* black -> viewfinder -> lock -> card -> save. A tap skips ahead; once the card has
     landed the same tap flips it between upright and full-bleed. */
  const phase = (cls) => B.classList.add(cls);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (still) {
    B.classList.add("s-scan", "s-lock", "s-reveal", "ready", "qr-landed");
  } else {
    scanTimers = [
      setTimeout(() => phase("s-scan"), 120),
      setTimeout(() => phase("s-lock"), 1450),
      setTimeout(() => phase("s-reveal"), 1850),
      setTimeout(flyQr, 2000),   // flies while the card is still turning in
      setTimeout(() => phase("ready"), 3300),
    ];
  }
  const onTap = (e) => {
    if (e.target.closest(".dock, .sheet")) return;
    if (!B.classList.contains("ready")) {
      scanTimers.forEach(clearTimeout); scanTimers = [];
      if (qrFlight) { qrFlight.finish(); } else { landQr(); }
      B.classList.add("fast", "s-scan", "s-lock", "s-reveal", "ready");
      return;
    }
    if (!sheet.hidden) return;
    B.classList.toggle("rotated");
  };
  // bound late so the tap that opened the link cannot skip the intro it just triggered
  scanTimers.push(setTimeout(() => addEventListener("pointerdown", onTap), 500));

  scanCleanup = () => {
    if (qrFlight) { qrFlight.cancel(); qrFlight = null; }
    const t = app.querySelector(".vfqr"); if (t) t.style.transformOrigin = "";
    removeEventListener("pointerdown", onTap);
    removeEventListener("resize", fit); removeEventListener("orientationchange", fit);
    if (window.visualViewport) visualViewport.removeEventListener("resize", fit);
    removeEventListener("keydown", onKey);
    B.style.removeProperty("--kUp"); B.style.removeProperty("--kRot");
  };
}

/* ---------- render card to PNG (mirrors the CSS layout) ---------- */
async function cardToPng(c, qrText) {
  const W = 1050, H = 600, fs = W / 100, pad = fs * 6;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  try { await Promise.all([400, 600, 800].map(w => document.fonts.load(`${w} ${fs * 7.2}px Manrope`))); } catch {}
  const font = (w, s) => `${w} ${s}px Manrope, system-ui, sans-serif`;
  /* canvas has no CSS letter-spacing, so .name's -.02em has to be applied here too,
     natively where supported and per-character where it is not, or measureText comes
     out ~20px wide at card size and fit() clips a name the DOM renders in full. */
  let track = 0;
  const setFont = (w, s, em = 0) => {
    x.font = font(w, s); track = 0;
    if ("letterSpacing" in x) x.letterSpacing = `${em}em`; else track = em * s;
  };
  const textW = (t) => x.measureText(t).width + track * t.length;
  const draw = (t, px, py) => {
    if (!track) return x.fillText(t, px, py);
    let cx = px;
    for (const ch of t) { x.fillText(ch, cx, py); cx += x.measureText(ch).width + track; }
  };
  x.fillStyle = "#fff"; x.fillRect(0, 0, W, H);
  const logo = new Image(); logo.src = COMPANY.logo.match(/src="([^"]+)"/)[1];
  await new Promise(r => { logo.onload = r; logo.onerror = r; });
  const lh = fs * 8, lw = logo.naturalWidth ? lh * logo.naturalWidth / logo.naturalHeight : 0;
  if (lw) x.drawImage(logo, pad, pad, lw, lh);
  const qrSize = fs * 26, qx = W - pad - qrSize, qy = H - pad - qrSize, maxW = qx - pad - fs * 5;
  const fit = (t, w) => {
    if (textW(t) <= w) return t;
    while (t.length > 1 && textW(t + "…") > w) t = t.slice(0, -1);
    return t + "…";
  };
  const lines = [c.phone, c.email, c.website].filter(Boolean);
  const lineH = fs * 2.9 * 1.5;
  let y = H - pad - lines.length * lineH + lineH * 0.7;
  x.fillStyle = "#6E6E6E"; setFont(400, fs * 2.9);
  lines.forEach((t, i) => draw(fit(t, maxW), pad, y + i * lineH));
  y = H - pad - lines.length * lineH - fs * 3;
  x.fillStyle = "#CC0033"; setFont(600, fs * 3.4); draw(fit(c.title || "", maxW), pad, y);
  x.fillStyle = "#2A2A2A"; setFont(800, fs * 7.2, -0.02); draw(fit(c.name, maxW), pad, y - fs * 4.4);
  const qr = qrcode(0, "M"); qr.addData(qrText); qr.make();
  const n = qr.getModuleCount(), cell = qrSize / n;
  x.fillStyle = "#000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) x.fillRect(qx + k * cell, qy + r * cell, Math.ceil(cell), Math.ceil(cell));
  const sh = fs * 1.6;
  x.fillStyle = "#FFCC33"; x.fillRect(0, H - sh, W * .34, sh);
  x.fillStyle = "#CC6600"; x.fillRect(W * .34, H - sh, W * .33, sh);
  x.fillStyle = "#CC3333"; x.fillRect(W * .67, H - sh, W * .33, sh);
  return new Promise(r => cv.toBlob(r, "image/png"));
}
async function saveImage(c, qrText) {
  const blob = await cardToPng(c, qrText);
  const file = new File([blob], c.name.replace(/\s+/g, "_") + "_card.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: c.name }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: file.name });
  a.click(); toast("Image downloaded");
}

/* ---------- router ---------- */
let scanTimers = [], scanCleanup = null;
function clearScan() {
  scanTimers.forEach(clearTimeout); scanTimers = [];
  if (scanCleanup) { scanCleanup(); scanCleanup = null; }
}
function route() {
  const h = location.hash.slice(1) || "/";
  clearScan();
  document.body.className = "chrome";
  document.documentElement.classList.remove("boot-scan");
  let m;
  if (h === "/") viewList();
  else if (h === "/new") viewEdit();
  else if ((m = h.match(/^\/edit\/(\w+)/))) viewEdit(m[1]);
  else if ((m = h.match(/^\/view\/(\w+)/))) viewCard(m[1]);
  else if ((m = h.match(/^\/card\?d=(.+)/))) viewPublic(m[1]);
  else location.hash = "#/";
  window.scrollTo(0, 0);
}
addEventListener("hashchange", route);
route();
</script>
